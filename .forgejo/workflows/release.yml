# Rendered from .forgejo/release-profile.yml.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || forgejo.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Source tests and release verification are completed locally before tagging.
      # CI builds and publishes the selected immutable tag without repeating them.
      - name: Build binaries
        id: build
        run: |
          set -euo pipefail
          mkdir -p dist
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          LDFLAGS="-s -w -X forge.harakara.site/littleisland/noe/v2/internal/cli.Version=$RELEASE_TAG"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/noe-linux-amd64 ./cmd/noe
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/noe-linux-arm64 ./cmd/noe
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/noe-darwin-amd64 ./cmd/noe
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/noe-darwin-arm64 ./cmd/noe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/noe-windows-amd64.exe ./cmd/noe
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/noe-windows-arm64.exe ./cmd/noe
          (cd dist && sha256sum noe-* > SHA256SUMS)

      - name: Upload release
        if: success()
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ forgejo.server_url }}
          repo: ${{ forgejo.repository }}
          token: ${{ forgejo.token }}
          tag: ${{ env.RELEASE_TAG }}
          sha: ${{ steps.build.outputs.sha }}
          release-dir: dist
          release-notes-file: docs/releases/${{ env.RELEASE_TAG }}.md
